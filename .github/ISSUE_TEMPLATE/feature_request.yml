name: Feature request
description: Propose a user-facing or developer-facing improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the outcome you would like to achieve.
        Do not include credentials, personal data, or security details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or development problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behaviour, not only a technical implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
