# Standalone production stack. Do not combine this file with compose.yml:
# compose.yml defines a local PostgreSQL service, while production uses an
# externally managed database configured in .env.
services:
  prestart:
    image: ghcr.io/wini83/findog-ledger-backend:${TAG?Set TAG in .env}
    restart: "no"
    command: bash scripts/prestart.sh
    env_file:
      - .env
    networks:
      - firefly_net

  backend:
    image: ghcr.io/wini83/findog-ledger-backend:${TAG?Set TAG in .env}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      firefly_net:
        aliases:
          - findog-ledger-backend

  frontend:
    image: ghcr.io/wini83/findog-ledger-frontend:${TAG?Set TAG in .env}
    restart: always
    env_file:
      - .env
    networks:
      firefly_net:
        aliases:
          - findog-ledger-frontend

networks:
  firefly_net:
    external: true
