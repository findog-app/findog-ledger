[tool.uv.workspace]
members = ["backend"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "commitizen"
version = "0.0.1a1"
version_files = [
    "backend/pyproject.toml:^version = \"(?P<version>.*)\"",
    "pyproject.toml:^version = \"(?P<version>.*)\"",
    "uv.lock:^version = \"(?P<version>.*)\"",
]
annotated_tag = true
